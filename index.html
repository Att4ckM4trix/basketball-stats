<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הסטטיסטיקות שלי</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🏀 הסטטיסטיקות שלי</h1>

    <!-- ===== ייבוא מאתר האיגוד ===== -->
    <section class="card">
      <h2>ייבוא מאתר האיגוד</h2>
      <div class="import-row">
        <input type="url" id="player-url" placeholder="https://ibasketball.co.il/player/...">
        <button type="button" id="import-button">עדכון מהאתר</button>
      </div>
      <p id="import-status" class="muted"></p>
    </section>

    <!-- ===== טופס הזנת / עריכת משחק ===== -->
    <section class="card" id="form-section">
      <h2 id="form-title">הוספת משחק</h2>
      <!-- הודעה שמופיעה כשהטופס מולא אוטומטית מאתר האיגוד -->
      <p id="form-hint" class="hint" hidden></p>
      <form id="game-form">

        <!-- fieldset מקבץ שדות קשורים, ו-legend הוא הכותרת של הקבוצה -->
        <fieldset>
          <legend>פרטי המשחק</legend>
          <div class="fields">
            <label>תאריך
              <input type="date" id="date" required>
            </label>
            <label>יריבה
              <input type="text" id="opponent" placeholder="למשל: מכבי חיפה" required>
            </label>
            <label>דקות
              <input type="number" id="minutes" min="0" max="60" required>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>סטטיסטיקה</legend>
          <div class="fields">
            <label>נקודות
              <input type="number" id="points" min="0" required>
            </label>
            <label>ריבאונדים
              <input type="number" id="rebounds" min="0" required>
            </label>
            <label>אסיסטים
              <input type="number" id="assists" min="0" required>
            </label>
            <label>חטיפות
              <input type="number" id="steals" min="0" required>
            </label>
            <label>איבודים
              <input type="number" id="turnovers" min="0" required>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>קליעה</legend>
          <div class="fields">
            <label>קליעות מהשדה <small>(כולל שלשות)</small>
              <input type="number" id="fgMade" min="0" required>
            </label>
            <label>ניסיונות מהשדה <small>(כולל שלשות)</small>
              <input type="number" id="fgAttempted" min="0" required>
            </label>
            <label>קליעות לשלוש
              <input type="number" id="threeMade" min="0" required>
            </label>
            <label>ניסיונות לשלוש
              <input type="number" id="threeAttempted" min="0" required>
            </label>
            <label>קליעות עונשין
              <input type="number" id="ftMade" min="0" required>
            </label>
            <label>ניסיונות עונשין
              <input type="number" id="ftAttempted" min="0" required>
            </label>
          </div>
        </fieldset>

        <p id="error" class="error" hidden></p>

        <div class="form-actions">
          <button type="submit" id="submit-button">שמירת משחק</button>
          <!-- type="button" חשוב: בלעדיו, לחיצה על "ביטול" הייתה שולחת את הטופס -->
          <button type="button" id="cancel-button" class="secondary" hidden>ביטול עריכה</button>
        </div>
      </form>
    </section>

    <!-- ===== גרף ===== -->
    <section class="card" id="chart-section" hidden>
      <h2>ההתקדמות שלי</h2>
      <p id="chart-message" class="muted" hidden></p>
      <!-- Chart.js מצייר את הגרף בתוך אלמנט canvas ("קנבס" = משטח ציור) -->
      <div class="chart-container">
        <canvas id="chart"></canvas>
      </div>
    </section>

    <!-- ===== טבלת המשחקים ===== -->
    <section class="card">
      <h2>כל המשחקים</h2>
      <div id="empty-message">
        <p class="muted">עוד לא הוזנו משחקים.</p>
        <!-- מופיע רק בגרסה המקוונת (GitHub Pages), כדי שאפשר יהיה לראות איך האפליקציה נראית עם נתונים -->
        <button type="button" id="demo-button" class="secondary" hidden>טעינת נתוני דוגמה</button>
      </div>

      <div class="table-wrapper">
        <table id="games-table" hidden>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>יריבה</th>
              <th>תוצאה</th>
              <th>דקות</th>
              <th>נקודות</th>
              <th>ריבאונדים</th>
              <th>אסיסטים</th>
              <th>חטיפות</th>
              <th>איבודים</th>
              <th>מהשדה</th>
              <th>שלשות</th>
              <th>עונשין</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="games-body"></tbody>
          <!-- tfoot = "רגל" הטבלה. כאן תופיע שורת הממוצעים -->
          <tfoot id="games-foot"></tfoot>
        </table>
      </div>
    </section>

    <p id="storage-info" class="muted"></p>
  </main>

  <!-- ספריית גרפים חיצונית. נטענת מהאינטרנט, ולכן חייבת לבוא לפני app.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
